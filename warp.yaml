root:
  description: 'warp: checks a TypeScript codebase against a declared model of its modules'
  ruleset:
    extends: [warp:recommended]
    rules: { function-cohesion: { maxLines: 20 } }
  modules:
    package:
      dir: src
      archetype: package
    tooling:
      description: The scripts behind ./do and the tool configs
      files: ['*.ts', 'scripts/*.ts']
      dependencies: ['node:*', npm:vite-plus, npm:typescript]
      exposes: all
      test: { modules: { tests: { files: ['*.test.ts', 'scripts/*.test.ts'] } } }
  test:
    ruleset: { rules: { function-cohesion: off } }
    provides: [npm:vite-plus/test, 'node:*']
    modules:
      e2e: { files: 'e2e/*.ts' }

archetypes:
  package:
    description: "warp's source: the domain, the app behind its ports, the adapters, the built-in rules and the CLI"
    entry: index.ts
    modules:
      domain:
        description: 'What warp knows, with no I/O: the model, its config language, fixes, facts and the rules API'
        dir: domain
        exposes: [errors, model, language, fixes, facts, rules]
        ruleset: { rules: { export-surface: { max: 60 } } }
        modules:
          errors:
            description: 'ConfigError, which every layer raises or reports when a config is wrong'
            dir: errors
            exposes: all
            ruleset: [warp:utility]
          model:
            description: 'ConfigData, resolving files to modules, reach, and rule settings by place'
            dir: model
            dependencies: [errors]
            exposes: all
            ruleset: { rules: { export-surface: { max: 40 } } }
            test: { modules: { tests: { files: '*.test.ts', dependencies: [language, npm:yaml] } } }
          language:
            description: 'Compiling a parsed warp.yaml into ConfigData: shape, names, cross-checks and rulesets'
            dir: language
            dependencies: [errors, model]
            exposes: { files: [compile.ts] }
          fixes:
            description: The config edits that would allow a refused import
            dir: fixes
            dependencies: [model]
            exposes: all
          facts:
            description: What analysis reads from each file, which is all a rule sees of the source
            dir: facts
            exposes: all
          rules:
            description: 'The rules API: what a rule implements, how rules are registered, and how findings compare'
            dir: rules
            exposes: [rule, registry, findings]
            modules:
              rule: { files: rule.ts, dependencies: [errors, model, facts], exposes: all }
              registry: { files: registry.ts, dependencies: [errors, rule], exposes: all }
              findings: { files: diff.ts, dependencies: [rule], exposes: all }
            test: { modules: { tests: { files: '*.test.ts', dependencies: [facts] } } }
      builtins:
        dir: builtins
        archetype: builtins
        dependencies:
          { errors: domain.errors, model: domain.model, rules: domain.rules, fixes: domain.fixes, facts: domain.facts }
        test: { dependencies: [app] }
      app:
        description: Loading a config, running the rules on a model, and diffing two commits, behind ports
        dir: app
        dependencies: [domain, 'node:crypto']
        exposes: all
        test: { modules: { tests: { files: '*.test.ts', dependencies: [builtins, npm:yaml] } } }
      adapters:
        description: 'What app reaches through its ports, and the formats findings are printed in'
        dir: adapters
        exposes: [analysis, config, git, reporters]
        modules:
          analysis:
            description: Reading TypeScript into facts, and the project folders
            dir: analysis
            dependencies: [app, domain, 'node:*', npm:typescript]
            exposes: all
            test: { modules: { tests: { files: '*.test.ts' } } }
          config:
            description: Reading a warp.yaml file and loading its plugins
            dir: config
            dependencies: [app, domain, 'node:*', npm:yaml]
            exposes: all
            test: { modules: { tests: { files: '*.test.ts' } } }
          git:
            description: 'Git: the caches under .git, keyed by the digest of warp itself, and the files at a commit'
            dir: git
            dependencies: [app, 'node:*']
            exposes: all
            test: { modules: { tests: { files: '*.test.ts' } } }
          reporters:
            description: 'Formats for findings and the model: text, JSON, SARIF and agent hooks'
            dir: reporters
            dependencies: [domain]
            exposes: all
            test: { modules: { tests: { files: '*.test.ts', dependencies: [npm:yaml] } } }
      cli:
        description: The CLI, which wires adapters, reporters and the built-in rules together
        files: cli.ts
        dependencies: [adapters, app, domain, builtins, 'node:*']
    test:
      modules:
        tests: { files: '*.test.ts', dependencies: [adapters, app, builtins, domain] }

  builtins:
    description: "warp's own rules: one folder per rule, the list of them, and the helpers rules share"
    requires: [errors, model, rules, fixes, facts]
    exposes: [list]
    ruleset: { rules: { export-spread: { ignore: [rules] } } }
    modules:
      list:
        description: The built-in rules with their docs links
        files: index.ts
        dependencies: [rule, rules, model]
        exposes: all
      helpers:
        description: What more than one rule needs, such as advice text, loops and package names
        files: '*.ts'
        dependencies: [errors, model, rules, fixes, facts]
        exposes: all
        ruleset: [warp:utility]
      rule:
        dir: '*'
        archetype: rule
        dependencies: [helpers, rules, model, fixes, facts]
        test: { dependencies: [app] }
    test:
      requires: [app]
      modules:
        tests: { files: '*.test.ts', dependencies: [app, model, fixes, npm:yaml] }

  rule:
    description: 'One built-in rule: its rule, its tests, its scenarios and its page'
    marker: README.md
    entry: rule.ts
    requires: [helpers, rules, model]
    modules:
      parts:
        description: What a rule splits out of rule.ts
        files: '**'
        dependencies: [helpers, rules, model]
        exposes: all
    test:
      requires: [app]
      modules:
        tests: { files: '**/*.test.ts', dependencies: [app, npm:yaml] }

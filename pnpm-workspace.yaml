overrides:
  vite@*: 'catalog:'
  # shortcut: Stryker's core asks for typed-rest-client ~2.3.0, which pins qs at 6.15.1, and that
  # version carries four advisories (https://github.com/advisories/GHSA-4mjr-xmp4-gh2g); drop the
  # override when the core takes a typed-rest-client that allows 6.16.1 or later.
  qs@*: 6.17.1
  # shortcut: Stryker's core asks for minimatch ~10.2.4, and every 10.x carries
  # https://github.com/advisories/GHSA-g3hv-75wg-m249; drop the override when the core moves to 11.
  '@stryker-mutator/core>minimatch': 11.0.9
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
# The peer rule (https://pnpm.io/settings/peer-dependencies#peerdependencyrules)
# accepts any vite version, because the core's own version number falls outside
# the ranges other packages ask for.
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

# Stryker's tsconfig rewrite reads TypeScript through the compiler's JavaScript API, which needs a
# `typescript` below 7, while warp itself runs on 7.1; Stryker carries one of its own
# (https://pnpm.io/settings#packageextensions).
packageExtensions:
  '@stryker-mutator/core':
    dependencies:
      typescript: 6.0.3

# Three days, the span Renovate waits, so a release withdrawn as compromised does not
# reach a machine (https://pnpm.io/settings/dependency-resolution#minimumreleaseage).
minimumReleaseAge: 4320
# Refuse a release weaker in publisher trust than an earlier release, which is what a
# hijacked account publishing looks like (https://pnpm.io/settings/dependency-resolution#trustpolicy).
trustPolicy: no-downgrade
saveExact: true
# Refuse to install on a Node outside `engines`, so every machine runs the version in .node-version.
engineStrict: true
